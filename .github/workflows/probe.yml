name: Probe ABS API
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for DF in "CPI,2.0.0" "CPI_M,1.2.0"; do
            echo "=== $DF"
            curl -sS -m 180 "https://data.api.abs.gov.au/rest/data/ABS,$DF/all?startPeriod=2026-08&format=csvfilewithlabels" -o d.csv || true
            head -1 d.csv; wc -l d.csv
            grep -i "trimmed" d.csv | grep -i "australia" | head -12
            grep -i "All groups CPI" d.csv | grep -i "Weighted average of eight\|Australia" | grep -i "corresponding\|annual\|year" | head -8
          done
