name: Update implied cash rate

on:
  schedule:
    # GitHub cron runs in UTC. 11:00 UTC = 9pm AEST / 10pm AEDT (after ASX settlement).
    - cron: "0 11 * * 1-5"
    # Second pass at 7am/8am Sydney next morning, in case the evening run failed.
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}
  # Re-run whenever the code changes, so the page always reflects the latest logic.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/**"

permissions:
  contents: write
  issues: write      # lets the job open/close a "data health" issue (GitHub emails you)

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # macOS runner: matches the setup already proven to scrape the ASX page.
    # Free for public repos. Chrome comes preinstalled.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Update data
        id: update
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ -f docs/data/meeting_history.csv ]; then
            python -u scripts/update.py 2>&1 | tee docs/data/run_log.txt
          else
            echo "First run: building history"
            python -u scripts/update.py --backfill 2>&1 | tee docs/data/run_log.txt
          fi

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Data update $(date -u +%F)"
            # Pick up any code pushed while this run was going, then push.
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Open or close the data health issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python scripts/health_report.py > /tmp/health.md && STATUS=problem || STATUS=ok
          gh label create data-health --color B60205 --description "Automated data checks" --force >/dev/null 2>&1 || true
          OPEN=$(gh issue list --label data-health --state open --json number --jq '.[0].number' || true)
          if [ "$STATUS" = problem ]; then
            if [ -n "$OPEN" ]; then
              gh issue edit "$OPEN" --body-file /tmp/health.md
            else
              gh issue create --title "Rates monitor: data needs attention" --label data-health --body-file /tmp/health.md
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "All data sources are up to date again ($RUN_URL)."
          fi

      - name: Fail if the update failed
        if: steps.update.outcome == 'failure'
        run: |
          echo "Update failed - see docs/data/run_log.txt"
          exit 1
