name: Update implied cash rate

on:
  schedule:
    # GitHub cron runs in UTC. 11:00 UTC = 9pm AEST / 10pm AEDT (after ASX settlement).
    - cron: "0 11 * * 1-5"
    # Second pass at 7am/8am Sydney next morning, in case the evening run failed.
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # macOS runner: matches the setup already proven to scrape the ASX page.
    # Free for public repos. Chrome comes preinstalled.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Update data
        id: update
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ -f docs/data/meeting_history.csv ]; then
            python -u scripts/update.py 2>&1 | tee docs/data/run_log.txt
          else
            echo "First run: building history"
            python -u scripts/update.py --backfill 2>&1 | tee docs/data/run_log.txt
          fi

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Data update $(date -u +%F)"
            git push
          fi

      - name: Fail if the update failed
        if: steps.update.outcome == 'failure'
        run: |
          echo "Update failed - see docs/data/run_log.txt"
          exit 1
